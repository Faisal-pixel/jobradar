services:
  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DB_PATH: ./data/jobradar.db
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./data:/app/data
      # The one-time OAuth sign-in (loopback browser flow) needs to run
      # locally, not through Docker — see CLAUDE.md Decisions Log. Once
      # google-token.json exists here, containerized runs reuse it with
      # no browser involved.
      - ./credentials:/app/credentials
    ports:
      # Streamable HTTP MCP server (Decision #4) — published to 127.0.0.1
      # only, never 0.0.0.0, matching the server's own bind-host restriction.
      - "127.0.0.1:3939:3939"
