Our tech spans the gamut from Android OS customization, apps, CLI tools, backend services, devops and web dashboards all the way through to device provisioning automation and optimal sourcing of hardware through our network of manufacturers.

# You

&gt; Looking for curious, driven engineer, 2+ years of s/w dev experience with focus on **cloud and backend**; unafraid to diversify; embodies our Core Values.

As a software engineer at Mason, you will be an integral part of changing the way enterprise mobile products are developed and deployed. We are growing quickly and looking for the right people to join our close-knit team to realize our expanding road map. We&#39;re still busy building the ground floor (arguably the basement) and we invite you to join us in the journey -- all while playing with a bunch of devices!

## You&#39;ll Be Successful At Mason If You:
* have 2+ years of experience
* embody our core values of being respectful, humble, ethical, collaborative, communicative and reliable
* are curious to learn and willing to teach
* have a positive attitude
* tend to be a self-starter and get stuff done, but are not afraid to seek help

## You Have:
* Actively done software development for 2+ years (ideally though not necessarily in a professional setting)
* Strong experience with backend development, including design and implementation of web services and RESTful APIs
* Experience with AWS (will consider experience with related platforms such as GCP or Heroku for the right candidate)
* A solid understanding of at least one backend-oriented programming language and a related web services stack
* Experience with scaling a web service
* Experience with testing and/or test automation
* A college degree with relevant coursework in computer science, esp. distributed computing, or equivalent professional experience

## Nice-To-Haves
None of the following are strict requirements, but are examples of specialized knowledge or experience that might be handy in tipping things in your favor:
* Familiarity with server-side JavaScript and the Node.js ecosystem
* Solid understanding of JavaScript (ES6 or later with Promises) and its testing frameworks (Mocha, Chai, Sinon and friends)
* Familiarity with the AWS ecosystem
* Knowledge of Android and its ecosystem, APIs and development tools
* Experience with front end Javascript frameworks such as React
* Interest in or knowledge of DevOps; experience with configuration management technologies such as Ansible
* Opinions on high availability deployments and self healing applications

# The Job

At Mason, we have a variety of things to work on and software engineers can generally expect to delve into areas outside their comfort zone.

## Cloud and Backend
This position is designed for our future go-to backend services person. Our core backend needs will involve some or all of the following:

* Architect Mason&#39;s web service properties to handle the expected scale and reliability requirements
* Enhance our core over-the-air update infrastructure
* Implement an authorization story for our web services
* Help translate customer specific requirements into generic solutions
* Architect and build new web services and tools

## Common
Most of our engineers can expect to do some or all of the following:
* Write design one-pagers and perform design reviews
* Perform peer code reviews
* Build and maintain test automation where appropriate
* Drive new product development
* Write public-facing documentation for new features and APIs for customers
* Help shape team development practices
* Collaborate with international teams
* Continuous integration / build management tool experience


# What&#39;s It Like At Mason?
At Mason, we value people over everything else (ok, except maybe our puppies. And [Tacos Chuki&#39;s](https://www.yelp.com/biz/tacos-chukis-seattle)).

## Our Core Values

We strive to embody our Core Values and look for the same in our future coworkers. They boil down to:

BE
- Respectful
- Humble
- Ethical
- Collaborative
- Communicative
- Reliable

## Perks
Here are some things we consider **perks**:

* Weekly &quot;Mason University&quot; lessons. Past topics include Fonts, Stonemasonry, GPS, Blockchain, Lock-picking, etc.
* Monday team-wide lunches
* Board game Fridays!
* Quarterly team outings
* Summer barbeques
* Dogs!

03c/h1\u003e\n\u003cblockquote\u003e\n\u003cp\u003eLooking for curious, driven engineer, 2+ years of s/w dev experience with focus on \u003cstrong\u003ecloud and backend\u003c/strong\u003e; unafraid to diversify; embodies our Core Values.\u003c/p\u003e\n\u003c/blockquote\u003e\n\u003cp\u003eAs a software engineer at Mason, you will be an integral part of changing the way enterprise mobile products are developed and deployed. We are growing quickly and looking for the right people to join our close-knit team to realize our expanding road map. We&#39;re still busy building the ground floor (arguably the basement) and we invite you to join us in the journey -- all while playing with a bunch of devices!\u003c/p\u003e\n\u003ch2\u003eYou&#39;ll Be Successful At Mason If You:\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003ehave 2+ years of experience\u003c/li\u003e\n\u003cli\u003eembody our core values of being respectful, humble, ethical, collaborative, communicative and reliable\u003c/li\u003e\n\u003cli\u003eare curious to learn and willing to teach\u003c/li\u003e\n\u003cli\u003ehave a positive attitude\u003c/li\u003e\n\u003cli\u003etend to be a self-starter and get stuff done, but are not afraid to seek help\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eYou Have:\u003c/h2\u003e\n\u003cul\u003e\n\u003cli\u003eActively done software development for 2+ years (ideally though not necessarily in a professional setting)\u003c/li\u003e\n\u003cli\u003eStrong experience with backend development, including design and implementation of web services and RESTful APIs\u003c/li\u003e\n\u003cli\u003eExperience with AWS (will consider experience with related platforms such as GCP or Heroku for the right candidate)\u003c/li\u003e\n\u003cli\u003eA solid understanding of at least one backend-oriented programming language and a related web services stack\u003c/li\u003e\n\u003cli\u003eExperience with scaling a web service\u003c/li\u003e\n\u003cli\u003eExperience with testing and/or test automation\u003c/li\u003e\n\u003cli\u003eA college degree with relevant coursework in computer science, esp. distributed computing, or equivalent professional experience\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eNice-To-Haves\u003c/h2\u003e\n\u003cp\u003eNone of the following are strict requirements, but are examples of specialized knowledge or experience that might be handy in tipping things in your favor:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eFamiliarity with server-side JavaScript and the Node.js ecosystem\u003c/li\u003e\n\u003cli\u003eSolid understanding of JavaScript (ES6 or later with Promises) and its testing frameworks (Mocha, Chai, Sinon and friends)\u003c/li\u003e\n\u003cli\u003eFamiliarity with the AWS ecosystem\u003c/li\u003e\n\u003cli\u003eKnowledge of Android and its ecosystem, APIs and development tools\u003c/li\u003e\n\u003cli\u003eExperience with front end Javascript frameworks such as React\u003c/li\u003e\n\u003cli\u003eInterest in or knowledge of DevOps; experience with configuration management technologies such as Ansible\u003c/li\u003e\n\u003cli\u003eOpinions on high availability deployments and self healing applications\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch1\u003eThe Job\u003c/h1\u003e\n\u003cp\u003eAt Mason, we have a variety of things to work on and software engineers can generally expect to delve into areas outside their comfort zone.\u003c/p\u003e\n\u003ch2\u003eCloud and Backend\u003c/h2\u003e\n\u003cp\u003eThis position is designed for our future go-to backend services person. Our core backend needs will involve some or all of the following:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eArchitect Mason&#39;s web service properties to handle the expected scale and reliability requirements\u003c/li\u003e\n\u003cli\u003eEnhance our core over-the-air update infrastructure\u003c/li\u003e\n\u003cli\u003eImplement an authorization story for our web services\u003c/li\u003e\n\u003cli\u003eHelp translate customer specific requirements into generic solutions\u003c/li\u003e\n\u003cli\u003eArchitect and build new web services and tools\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003eCommon\u003c/h2\u003e\n\u003cp\u003eMost of our engineers can expect to do some or all of the following:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWrite design one-pagers and perform design reviews\u003c/li\u003e\n\u003cli\u003ePerform peer code reviews\u003c/li\u003e\n\u003cli\u003eBuild and maintain test automation where appropriate\u003c/li\u003e\n\u003cli\u003eDrive new product development\u003c/li\u003e\n\u003cli\u003eWrite public-facing documentation for new features and APIs for customers\u003c/li\u003e\n\u003cli\u003eHelp shape team development practices\u003c/li\u003e\n\u003cli\u003eCollaborate with international teams\u003c/li\u003e\n\u003cli\u003eContinuous integration / build management tool experience\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch1\u003eWhat&#39;s It Like At Mason?\u003c/h1\u003e\n\u003cp\u003eAt Mason, we value people over everything else (ok, except maybe our puppies. And \u003ca href=\&quot;https://www.yelp.com/biz/tacos-chukis-seattle\&quot;\u003eTacos Chuki&#39;s\u003c/a\u003e).\u003c/p\u003e\n\u003ch2\u003eOur Core Values\u003c/h2\u003e\n\u003cp\u003eWe strive to embody our Core Values and look for the same in our future coworkers. They boil down to:\u003c/p\u003e\n\u003cp\u003eBE\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eRespectful\u003c/li\u003e\n\u003cli\u003eHumble\u003c/li\u003e\n\u003cli\u003eEthical\u003c/li\u003e\n\u003cli\u003eCollaborative\u003c/li\u003e\n\u003cli\u003eCommunicative\u003c/li\u003e\n\u003cli\u003eReliable\u003c/li\u003e\n\u003c/ul\u003e\n\u003ch2\u003ePerks\u003c/h2\u003e\n\u003cp\u003eHere are some things we consider \u003cstrong\u003eperks\u003c/strong\u003e:\u003c/p\u003e\n\u003cul\u003e\n\u003cli\u003eWeekly \&quot;Mason University\&quot; lessons. Past topics include Fonts, Stonemasonry, GPS, Blockchain, Lock-picking, etc.\u003c/li\u003e\n\u003cli\u003eMonday team-wide lunches\u003c/li\u003e\n\u003cli\u003eBoard game Fridays!\u003c/li\u003e\n\u003cli\u003eQuarterly team outings\u003c/li\u003e\n\u003cli\u003eSummer barbeques\u003c/li\u003e\n\u003cli\u003eDogs!\u003c/li\u003e\n\u003c/ul\u003e\n&quot;,&quot;interviewProcessHtml&quot;:null},&quot;company&quot;:{&quot;name&quot;:&quot;Mason&quot;,&quot;slug&quot;:&quot;mason&quot;,&quot;batch&quot;:&quot;W16&quot;,&quot;description&quot;:&quot;Mason is the fastest way to take smart devices from idea to end user&quot;,&quot;hiringDescriptionHtml&quot;:&quot;\u003cp\u003eMason provides the only fully managed infrastructure for developing and delivering dedicated devices. Whether building a single-use device from scratch or scaling a line of smart products, Mason is the fastest way to take smart devices from idea to end user without reinventing the wheel.\u003c/p\u003e\n\u003cp\u003eDEI AT MASON\nA diverse workforce with a broad range of perspectives fosters an environment of trust, collaboration, and innovation. And those effects reach all the way to our customers.\u003c/p\u003e\n\u003cp\u003ePSYCHOLOGICAL SAFETY\nPsychological safety is feeling comfortable enough to take risks and feel vulnerable in front of your team members and peers. When we strive to foster an environment of safety, belonging, equity and diversity it nurtures our innovation and brings us closer to our vision. We are constantly working toward being a better workplace that positively impacts the communities our team members and partners call home.\u003c/p\u003e\n\u003cp\u003eEQUITABLE OPPORTUNITIES\nTo keep our values aligned with our behavior and organizational structure we aim to eliminate barriers, then strategically create and reinforce positive practices to produce equitable opportunities and empower every Mason, especially those from underrepresented communities. We cannot possibly build smart and sustainable products without diverse and inclusive teams.\u003c/p\u003e\n\u003cp\u003eBE SEEN, VALIDATED, AND WELCOMED\nBelonging, psychological safety, and inclusivity unlock a Mason’s full potential. We don’t want Masons to quietly assimilate into a dominant culture and sacrifice a piece of themselves. We want our team members to be seen, validated, and welcomed. Although we still have a long way to go, when we engage with our team members and listen to their unique stories, we benefit.\u003c/p\u003e\n\u003cp\u003eWe&#39;re post-series A, profitable, growing, and have LOTS to build! Check out our website for all open jobs: \u003ca href=\&quot;https://bymason.com/careers/\&quot;\u003ehttps://bymason.com/careers/\u003c/a\u003e\u003c/p\u003e\n&quot;,&quot;techDescriptionHtml&quot;:&quot;\u003cp\u003eAndroid, AOSP hacking, Node.js services on AWS, React frontend, Python CLI;, Docker\u003c/p\u003e\n&quot;,&quot;logoUrl&quot;:&quot;https://bookface-images.s3.amazonaws.com/small_logos/70881ad94c495ff9a1501555a31b61ee9ba0c769.png&quot;,&quot;url&quot;:&quot;http://www.bymason.com&quot;,&quot;twitterUrl&quot;:&quot;https://twitter.com/buildwithMason&quot;,&quot;facebookUrl&quot;:&quot;https://www.facebook.com/buildwithmason/&quot;,&quot;location&quot;:&quot;Seattle, WA&quot;,&quot;teamSize&quot;:65,&quot;industry&quot;:&quot;B2B&quot;,&quot;industries&quot;:[&quot;B2B Software and Services&quot;],&quot;founders&quot;:[{&quot;name&quot;:&quot;Jim Xiao&quot;,&quot;avatarUrl&quot;:&quot;https://bookface-images.s3.amazonaws.com/avatars/f7473677c462fbfe0e027762147c0ca97e8a1f0e.jpg&quot;,&quot;bio&quot;:&quot;Past experience at Microsoft, VC, and wireless. Currently at Mason, working on letting anyone create their own smart hardware product like Peloton or Square.&quot;,&quot;pastCompanies&quot;:&quot;Director of Strategy and Planning at Nexlink Communications, Windows Business Group Consumer Marketing at Microsoft Corporation, vibeglobe&quot;,&quot;linkedin&quot;:&quot;https://www.linkedin.com/in/jimxiao&quot;}],&quot;jobs&quot;:[{&quot;id&quot;:30657,&quot;title&quot;:&quot;Full Sta
